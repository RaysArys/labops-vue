services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labfik_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trial-db-password-change-me}
      POSTGRES_DB: postgres
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-labfik_inventory}
      POSTGRES_KEYCLOAK_DB: ${POSTGRES_KEYCLOAK_DB:-keycloak}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labfik_admin} -d ${POSTGRES_APP_DB:-labfik_inventory}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-labfik_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-trial-db-password-change-me}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-trial-change-me}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-labfik_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-trial-db-password-change-me}
      DB_NAME: ${POSTGRES_APP_DB:-labfik_inventory}
      AUTH_STRATEGY: ${AUTH_STRATEGY:-keycloak}
      ALLOW_TRIAL_SEED: ${ALLOW_TRIAL_SEED:-false}
      TRIAL_PASSWORD: ${TRIAL_PASSWORD:-Trial123!}
      JWT_SECRET: ${JWT_SECRET:-local-fallback-secret-change-me}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-labfik}/protocol/openid-connect/certs
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-labfik}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-labfik-api}
      KEYCLOAK_VALIDATE_AUDIENCE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      AUTH_STRATEGY: ${AUTH_STRATEGY:-keycloak}
      KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-labfik}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-labfik-frontend}
      KEYCLOAK_ROLE_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-labfik-api}
    ports:
      - "3001:80"
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
